# Live at https://sentinelscan-yd2u.onrender.com -- verified end-to-end 2026-08-09
# (Google Sign-In, a full scan, and PDF/JSON report generation all confirmed working).
services:
  - type: web
    name: sentinelscan
    env: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT apps.backend.app:app
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: BLOCKED_DOMAINS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        sync: false
      # Off by design until Workstreams A, B and C are integrated and verified together.
      # Declared here rather than left to the code default so the switch is visible in the
      # Render dashboard, and flipping it on is a deliberate act rather than a discovery.
      - key: SENTINELSCAN_TELEMETRY_ENABLED
        value: "0"
