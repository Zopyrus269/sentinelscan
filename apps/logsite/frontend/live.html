<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SentinelScan real-time structured telemetry feed and audit log console.">
  <title>Live Events — SentinelScan</title>
  <link rel="stylesheet" href="/static/css/logsite.css">
</head>
<body>

  <!-- Header / Navbar -->
  <header class="ls-header">
    <div class="ls-header-inner">
      <div class="ls-brand-group">
        <a href="/" class="ls-brand">SentinelScan</a>
        <span class="ls-brand-sub">/ Observability</span>
      </div>

      <button class="ls-mobile-toggle" onclick="window.toggleMobileNav()" aria-label="Toggle navigation">☰</button>

      <nav id="mainNav" class="ls-nav">
        <a href="/">Status</a>
        <a href="/live.html" class="active">Live Events</a>
        <a href="/sessions.html">Sessions</a>
        <a href="/llm.html">LLM Usage</a>
        <a href="/health.html">Health</a>
      </nav>

      <div class="ls-header-right">
        <div id="authControls"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="ls-container" style="padding-top: 36px; padding-bottom: 56px;">

      <!-- Auth Banner in Normal Flow -->
      <div id="logsiteAuthBanner" class="hidden"></div>

      <!-- Page Header & Terminal Prompt Bar -->
      <div style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
        <div>
          <div class="mono" style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">
            <span style="color: var(--cyan);">sentinelscan@telemetry:~$</span> stream --tail
          </div>
          <h1 class="ls-page-title">LIVE EVENT STREAM</h1>
        </div>
        <div style="display: flex; align-items: center; gap: 14px;">
          <div class="mono" style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;">
            <span>Active users (5m):</span>
            <span id="liveActiveUsers" style="font-weight: 700; color: #ffffff;">—</span>
          </div>
        </div>
      </div>

      <!-- Filter Controls Toolbar -->
      <div class="ls-card" style="padding: 12px 18px; margin-bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
        <span class="mono" style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-right: 4px;">
          FILTER
        </span>
        <select id="filterLevel" class="ls-select">
          <option value="">All Severities</option>
          <option value="debug">DEBUG</option>
          <option value="info">INFO</option>
          <option value="warn">WARN</option>
          <option value="error">ERROR</option>
        </select>
        <select id="filterSource" class="ls-select">
          <option value="">All Sources</option>
          <option value="frontend">Frontend</option>
          <option value="backend">Backend</option>
          <option value="worker">Worker</option>
        </select>
        <select id="filterCategory" class="ls-select">
          <option value="">All Categories</option>
          <option value="ui">UI</option>
          <option value="http">HTTP</option>
          <option value="scan">Scan</option>
          <option value="llm">LLM</option>
          <option value="agent">Agent</option>
          <option value="worker">Worker</option>
          <option value="auth">Auth</option>
          <option value="error">Error</option>
        </select>
        <button id="btnResetFilters" class="ls-btn-secondary" style="font-size: 11.5px; padding: 5px 12px;">
          Reset
        </button>
        <div style="flex: 1;"></div>
        <div id="livePollingStatus" class="mono" style="font-size: 11.5px; color: var(--text-muted); display: flex; align-items: center; gap: 8px;">
          <span class="ls-spinner"></span> Connecting…
        </div>
      </div>

      <!-- Dense Events Table Console -->
      <div class="ls-card" style="padding: 0; overflow: hidden;">
        <div style="overflow-x: auto;">
          <table class="ls-table">
            <thead>
              <tr>
                <th style="width: 105px;">Timestamp</th>
                <th style="width: 75px;">Severity</th>
                <th style="width: 90px;">Source</th>
                <th style="width: 100px;">Category</th>
                <th>Event Message / Context</th>
              </tr>
            </thead>
            <tbody id="eventsBody">
              <tr>
                <td colspan="5" style="text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px;">
                  <span class="ls-spinner" style="margin-right: 6px; vertical-align: middle;"></span> Streaming telemetry events…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="/static/js/auth.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/live.js"></script>
</body>
</html>
