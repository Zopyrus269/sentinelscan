<!DOCTYPE html>
<link rel="stylesheet" href="/static/css/styles.css">
<html lang="en" class="dark">
<head>
    <script>
        (() => {
            if (sessionStorage.getItem("sentinelscan_intro_seen") !== "1") {
                document.documentElement.style.visibility = "hidden";
            }
        })();
    </script>
    <meta charset="utf-8">
    <meta
        content="width=device-width, initial-scale=1.0"
        name="viewport"
    >

    <title>SentinelScan | Live Dashboard</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet"
    >

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-surface-variant": "#434655",
                        "on-tertiary-container": "#ffede6",
                        "primary-fixed-dim": "#b4c5ff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-secondary-fixed": "#0b1c30",
                        "inverse-on-surface": "#eef0ff",
                        "error-container": "#ffdad6",
                        "outline": "#737686",
                        "border": "#E2E8F0",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-dim": "#d2d9f4",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-secondary-fixed-variant": "#38485d",
                        "surface-variant": "#dae2fd",
                        "surface-container": "#eaedff",
                        "surface-container-highest": "#dae2fd",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "tertiary": "#943700",
                        "success": "#22C55E",
                        "error": "#ba1a1a",
                        "on-surface": "#131b2e",
                        "outline-variant": "#c3c6d7",
                        "tertiary-fixed-dim": "#ffb596",
                        "secondary": "#505f76",
                        "primary-fixed": "#dbe1ff",
                        "inverse-surface": "#283044",
                        "on-background": "#131b2e",
                        "inverse-primary": "#b4c5ff",
                        "primary": "#004ac6",
                        "secondary-fixed": "#d3e4fe",
                        "surface-tint": "#0053db",
                        "critical": "#EF4444",
                        "warning": "#F59E0B",
                        "on-tertiary-fixed": "#360f00",
                        "background": "#F8FAFC",
                        "tertiary-container": "#bc4800",
                        "surface-container-high": "#e2e7ff",
                        "secondary-container": "#d0e1fb",
                        "on-primary-fixed": "#00174b",
                        "on-primary": "#ffffff",
                        "primary-container": "#2563eb",
                        "on-primary-container": "#eeefff",
                        "surface-container-low": "#f2f3ff",
                        "surface": "#FFFFFF",
                        "on-secondary-container": "#54647a",
                        "surface-bright": "#faf8ff"
                    },

                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },

                    spacing: {
                        gutter: "24px",
                        xl: "64px",
                        lg: "40px",
                        md: "24px",
                        "margin-desktop": "32px",
                        xs: "8px",
                        "margin-mobile": "16px",
                        sm: "16px",
                        base: "4px"
                    },

                    fontFamily: {
                        "headline-lg": ["Inter"],
                        "mono-md": ["JetBrains Mono"],
                        "headline-sm": ["Inter"],
                        display: ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "body-sm": ["Inter"]
                    },

                    fontSize: {
                        "headline-lg": [
                            "32px",
                            {
                                lineHeight: "40px",
                                letterSpacing: "-0.02em",
                                fontWeight: "600"
                            }
                        ],

                        "mono-md": [
                            "14px",

                            }

                        display: [

                        "label-sm": [
                            "12px",

                                lineHeight: "16px",
                                letterSpacing: "0.05em",
                                fontWeight: "600"

                        ],

                        "body-lg": [
                            "18px",
                            {
                                lineHeight: "28px",
                                fontWeight: "400"
                            }
                        ],

                        "headline-md": [
                            "24px",
                            {
                                lineHeight: "32px",
                                letterSpacing: "-0.01em",
                                fontWeight: "600"
                            }
                        ],

                        "body-md": [
                            "16px",
                            {
                                lineHeight: "24px",
                                fontWeight: "400"
                            }
                        ],

                        "label-md": [

                            {

                                letterSpacing: "0.01em",

                        "body-sm": [
                            "14px",
                            {
                                lineHeight: "20px",
                                fontWeight: "400"

                    }
                }
            }
        };
    </script>

    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #F8FAFC;
        }

        .material-symbols-outlined {
            font-variation-settings:
                "FILL" 0,
                "wght" 400,
                "GRAD" 0,
                "opsz" 24;
        }

        .terminal-container::-webkit-scrollbar {
            width: 4px;
        }

        .terminal-container::-webkit-scrollbar-thumb {
            background: #434655;
            border-radius: 2px;
        }
    </style>
  <link rel="stylesheet" href="/static/react-dist/main.css">
</head>

<body class="bg-background text-on-surface ss-dashboard-page">
    <!-- Top Navigation Bar -->
    <header
        class="z-50"
    >
        <nav
            class="flex h-16 w-full items-center justify-between px-margin-mobile md:px-margin-desktop"
        >
            <a
                href="/"
                class="text-2xl font-bold tracking-tight"
            >
                <span id="sentinelscan-brand-shiny"></span>
            </a>

            <div class="flex items-center gap-sm mr-16 md:mr-20">
                <div class="relative" id="profileButtonWrapper">
                  <button
                    id="profileButton"
                    class="flex h-8 w-8 items-center justify-center rounded-full overflow-hidden transition-all duration-300 hover:scale-[1.2] cursor-pointer"
                    aria-label="SentinelScan profile"
                  >
                    <span id="profileIconDefault" class="flex h-[18px] w-[18px] items-center justify-center">
                      <img
                        src="https://images.shadcnspace.com/assets/svgs/icon-google.svg"
                        alt="google icon"
                        class="h-4 w-4"
                      />
                    </span>
                    <img id="profileAvatar" class="h-full w-full object-cover hidden" alt="Profile photo" referrerpolicy="no-referrer" />
                  </button>
                  <!-- Same terminal theme as ScanTerminal.jsx / the account
                       history modal: black background, monospace type,
                       macOS-style traffic lights. Sign Out is a
                       GooeyActionNav (React Bits GooeyNav), mounted by
                       main.jsx into #signOutActions -- see auth.js's
                       window.performSignOutAction for what it calls once
                       its click animation finishes. -->
                  <div id="profileDropdown" class="absolute right-0 mt-2 w-64 overflow-hidden rounded-lg border border-white/10 bg-black font-mono shadow-lg z-50">
                    <div class="flex items-center gap-1.5 border-b border-white/10 px-3 py-2">
                      <div class="h-2.5 w-2.5 rounded-full bg-red-500"></div>
                      <div class="h-2.5 w-2.5 rounded-full bg-yellow-500"></div>
                      <div class="h-2.5 w-2.5 rounded-full bg-green-500"></div>
                      <span class="ml-2 text-[10px] text-gray-500">sentinelscan@profile:~$</span>
                    </div>
                    <div class="flex items-center gap-3 border-b border-white/10 px-4 py-3">
                      <div class="relative flex h-10 w-10 shrink-0 items-center justify-center overflow-hidden rounded-full border border-white/10 bg-white/5">
                        <span id="profileDropdownIconDefault" class="flex h-5 w-5 items-center justify-center">
                          <img
                            src="https://images.shadcnspace.com/assets/svgs/icon-google.svg"
                            alt="google icon"
                            class="h-5 w-5"
                          />
                        </span>
                        <img id="profileDropdownAvatar" class="absolute inset-0 hidden h-full w-full object-cover" alt="Profile photo" referrerpolicy="no-referrer" />
                      </div>
                      <div class="min-w-0 flex-1">
                        <p id="profileDropdownName" class="truncate text-sm font-semibold text-white"></p>
                        <p id="profileEmail" class="truncate text-xs text-cyan-400"></p>
                      </div>
                    </div>
                    <div class="flex flex-col gap-1 px-2 py-2">
                      <button id="openAccountButton" class="flex w-full items-center gap-2 rounded-md px-2 py-2 text-left text-sm text-gray-300 transition-colors hover:bg-white/10 hover:text-white">
                        <span class="material-symbols-outlined text-[18px] text-emerald-400">person</span>
                        View Profile
                      </button>
                    </div>
                    <div class="border-t border-white/10 px-2 py-2">
                      <div id="signOutActions"></div>
                    </div>
                  </div>
                </div>
            </div>
        </nav>
    </header>

    <main
        class="max-w-[1440px] mx-auto px-margin-mobile md:px-margin-desktop py-lg space-y-lg"
    >
        <!-- Dashboard Notice (no scan ID, invalid/missing scan, fetch/backend errors) -->
        <div id="sentinelscan-dashboard-notice"></div>

        <!-- Live Scan Terminal -->
        <div id="sentinelscan-scan-terminal" class="w-[90vw] max-w-[90vw] relative left-1/2 -translate-x-1/2"></div>

    </main>

    <!-- Footer -->
    <footer>
        <div class="flex w-full items-end justify-between px-margin-mobile py-lg md:px-margin-desktop">
            <div id="sentinelscan-footer-brand"></div>
            <div id="sentinelscan-footer-links"></div>
        </div>
    </footer>

    <script src="/static/js/dashboard.js" defer></script>
    <div
        id="accountModal"
        class="fixed inset-0 z-[100] hidden items-start justify-center overflow-y-auto bg-inverse-surface/50 px-4 py-6 sm:py-10"
        role="dialog"
        aria-modal="true"
        aria-labelledby="accountModalTitle"
    >
        <div id="accountModalBackdrop" class="fixed inset-0 bg-inverse-surface/50 backdrop-blur-sm" aria-hidden="true"></div>
        <!-- Same terminal theme as ScanTerminal.jsx (this page's own live
             scan console): black background, monospace type, macOS-style
             traffic lights in the header bar. Not the React component
             itself -- this modal is built/opened by plain auth.js, not
             mounted by main.jsx -- just the same visual language applied
             in plain HTML/Tailwind. -->
        <div class="relative z-10 my-auto w-full max-w-xl overflow-hidden rounded-lg border border-white/10 bg-black font-mono shadow-2xl">
            <div class="sticky top-0 z-20 flex items-center gap-2 border-b border-white/10 bg-black px-3 py-3 text-xs text-gray-400">
                <div class="flex gap-1.5">
                    <div class="h-3 w-3 rounded-full bg-red-500"></div>
                    <div class="h-3 w-3 rounded-full bg-yellow-500"></div>
                    <div class="h-3 w-3 rounded-full bg-green-500"></div>
                </div>
                <h2 id="accountModalTitle" class="flex-1 text-center font-semibold">sentinelscan@account:~$ | Scan History</h2>
                <button id="accountModalCloseButton" type="button" class="flex h-7 w-7 items-center justify-center rounded text-gray-400 transition-colors hover:bg-white/10 hover:text-white" aria-label="Close account dialog">
                    <span class="material-symbols-outlined text-[18px]">close</span>
                </button>
            </div>
            <div id="accountModalScrollableContent" class="max-h-[calc(100vh-14rem)] overflow-y-auto bg-black px-4 py-4" style="scrollbar-width: thin; scrollbar-color: #10b981 #1f2937;">
                <div id="accountPanelHistory" class="account-panel">
                    <div class="mb-3 text-xs text-gray-500">$ ls ~/scans --recent</div>
                    <div id="historyLoading" class="hidden py-6 text-center text-sm text-gray-500">Loading history...</div>
                    <div id="historyEmpty" class="hidden py-6 text-center text-sm text-gray-500">
                        <p>No scan history yet.</p>
                        <p class="mt-2">Run your first scan to see it here.</p>
                    </div>
                    <div id="historyError" class="hidden py-6 text-center text-sm text-red-400"></div>
                    <div id="historyList" class="flex flex-col gap-3 py-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/auth.js"></script>
  <script src="/static/react-dist/main.js"></script>
</body>
</html>
